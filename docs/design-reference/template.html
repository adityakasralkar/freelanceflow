<style>/* FreelanceFlow — minimal white SaaS theme */
:root {
  --bg: #f3f6f4;
  --panel: #ffffff;
  --panel-soft: #f7faf8;
  --line: #e5ebe8;
  --line-strong: #d2dbd6;
  --text: #15211c;
  --muted: #5b6b64;
  --faint: #93a39c;
  --green: #0a8f63;
  --green-dark: #066848;
  --green-soft: #e8f6f0;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --amber: #d97706;
  --amber-soft: #fff7ed;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;
  --shadow-sm: 0 1px 2px rgba(12, 24, 20, 0.04), 0 1px 1px rgba(12, 24, 20, 0.03);
  --shadow: 0 4px 14px -4px rgba(12, 24, 20, 0.08);
  --radius: 10px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

/* ============= APP SHELL ============= */
.ff-app {
  width: 1440px;
  height: 900px;
  display: grid;
  grid-template-columns: 232px 1fr;
  background: var(--panel);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--line);
  font-family: "Inter", sans-serif;
}

.ff-app.no-sidebar { grid-template-columns: 1fr; }

/* ============= SIDEBAR ============= */
.ff-sidebar {
  background: linear-gradient(180deg, #ffffff, #fafcfb);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 12px 16px;
}

.ff-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px 18px;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.ff-brand-mark {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: var(--green);
  display: grid; place-items: center;
  color: #fff; font-size: 13px; font-weight: 800;
}
.ff-brand-dot { color: var(--green); }
.ff-brand-sub {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0;
  margin-top: 1px;
}

.ff-nav-label {
  margin: 14px 10px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ff-nav { display: flex; flex-direction: column; gap: 2px; }
.ff-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.ff-nav-item:hover {
  background: #f1f3f6;
  color: var(--text);
}
.ff-nav-item.active {
  background: var(--green-soft);
  color: var(--green-dark);
  font-weight: 600;
}
.ff-nav-item.active .ff-nav-icon { color: var(--green); }
.ff-nav-icon {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  color: var(--faint);
  display: grid; place-items: center;
}
.ff-nav-item.active .ff-nav-icon { color: var(--green); }
.ff-nav-badge {
  margin-left: auto;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: #eef0f3;
  color: var(--muted);
  font-weight: 600;
}
.ff-nav-item.active .ff-nav-badge { background: #cfeede; color: var(--green-dark); }

.ff-side-bottom {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.ff-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
}
.ff-user:hover { background: #f1f3f6; }
.ff-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0a8f63, #066848);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 12px;
  flex: 0 0 32px;
}
.ff-avatar.alt { background: linear-gradient(135deg, #2563eb, #1e40af); }
.ff-avatar.amber { background: linear-gradient(135deg, #d97706, #b45309); }
.ff-avatar.purple { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
.ff-user-name { font-size: 13px; font-weight: 600; color: var(--text); }
.ff-user-email { font-size: 11px; color: var(--muted); }

/* ============= MAIN ============= */
.ff-main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.ff-topbar {
  height: 68px;
  padding: 0 28px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
.ff-topbar-left h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.ff-topbar-left p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}
.ff-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ff-content {
  padding: 28px;
  overflow-y: auto;
  flex: 1;
}

/* ============= CONTROLS ============= */
.ff-btn {
  height: 36px;
  padding: 0 14px;
  border-radius: 7px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.12s;
}
.ff-btn:hover { background: #f7faf8; border-color: var(--muted); }
.ff-btn.primary {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.ff-btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
.ff-btn.danger {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.ff-btn.danger:hover { background: #b91c1c; }
.ff-btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.ff-btn.ghost:hover { background: #f1f3f6; color: var(--text); }
.ff-btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.ff-btn.icon { width: 36px; padding: 0; justify-content: center; }
.ff-btn.icon.sm { width: 30px; }

.ff-input,
.ff-select,
.ff-textarea {
  height: 38px;
  padding: 0 12px;
  border-radius: 7px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  width: 100%;
  outline: none;
  transition: border 0.12s, box-shadow 0.12s;
}
.ff-input:focus,
.ff-select:focus,
.ff-textarea:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(15, 159, 114, 0.12);
}
.ff-input::placeholder, .ff-textarea::placeholder { color: var(--faint); }
.ff-textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 80px; }
.ff-input.search {
  padding-left: 36px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2398A2B3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>");
  background-repeat: no-repeat;
  background-position: 12px center;
}

.ff-field { display: flex; flex-direction: column; gap: 6px; }
.ff-field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}
.ff-field .helper { font-size: 11px; color: var(--muted); }

/* ============= CARDS ============= */
.ff-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.ff-card.tight { padding: 16px; }
.ff-card.flush { padding: 0; overflow: hidden; }
.ff-card-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ff-card-head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
}
.ff-card-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ff-card-body { padding: 20px; }

/* ============= STAT CARDS ============= */
.ff-stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ff-stat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ff-stat-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.ff-stat-icon {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: grid; place-items: center;
  background: var(--panel-soft);
  color: var(--muted);
}
.ff-stat-icon.green { background: var(--green-soft); color: var(--green-dark); }
.ff-stat-icon.blue { background: var(--blue-soft); color: var(--blue); }
.ff-stat-icon.amber { background: var(--amber-soft); color: var(--amber); }
.ff-stat-icon.red { background: var(--red-soft); color: var(--red); }
.ff-stat-icon.purple { background: var(--purple-soft); color: var(--purple); }
.ff-stat-value {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.ff-stat-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
}
.ff-stat-trend.up { color: var(--green-dark); }
.ff-stat-trend.down { color: var(--red); }
.ff-stat-trend.neutral { color: var(--muted); }

/* ============= STATUS BADGES ============= */
.ff-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.ff-badge::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.ff-badge.gray  { background: #f1f3f6; color: #475467; }
.ff-badge.blue  { background: var(--blue-soft); color: var(--blue); }
.ff-badge.green { background: var(--green-soft); color: var(--green-dark); }
.ff-badge.amber { background: var(--amber-soft); color: var(--amber); }
.ff-badge.red   { background: var(--red-soft); color: var(--red); }
.ff-badge.purple { background: var(--purple-soft); color: var(--purple); }

/* ============= TABLES ============= */
.ff-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.ff-table th {
  text-align: left;
  padding: 10px 16px;
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.ff-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.ff-table tbody tr:last-child td { border-bottom: 0; }
.ff-table tbody tr { transition: background 0.1s; cursor: pointer; }
.ff-table tbody tr:hover { background: #fafbfc; }
.ff-cell-primary { font-weight: 600; color: var(--text); }
.ff-cell-secondary { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ============= TABS ============= */
.ff-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line);
}
.ff-tab {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.12s, border-color 0.12s;
}
.ff-tab:hover { color: var(--text); }
.ff-tab.active {
  color: var(--green-dark);
  border-bottom-color: var(--green);
  font-weight: 600;
}
.ff-tab .count {
  margin-left: 6px;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: #eef0f3;
  color: var(--muted);
  font-weight: 600;
}
.ff-tab.active .count { background: var(--green-soft); color: var(--green-dark); }

/* Pill tabs (segmented) */
.ff-pill-tabs {
  display: inline-flex;
  background: #f1f3f6;
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
}
.ff-pill-tab {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}
.ff-pill-tab.active {
  background: var(--panel);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* ============= PROGRESS ============= */
.ff-bar {
  height: 6px;
  background: #eef0f3;
  border-radius: 999px;
  overflow: hidden;
}
.ff-bar > span {
  display: block;
  height: 100%;
  background: var(--green);
  border-radius: inherit;
  transition: width 0.3s;
}
.ff-bar.amber > span { background: var(--amber); }
.ff-bar.blue > span { background: var(--blue); }
.ff-bar.purple > span { background: var(--purple); }

/* ============= TIMELINE ============= */
.ff-timeline {
  position: relative;
  padding-left: 24px;
}
.ff-timeline::before {
  content: "";
  position: absolute;
  left: 8px; top: 6px; bottom: 6px;
  width: 2px;
  background: var(--line);
}
.ff-tl-item {
  position: relative;
  padding-bottom: 18px;
}
.ff-tl-item:last-child { padding-bottom: 0; }
.ff-tl-dot {
  position: absolute;
  left: -22px; top: 6px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--line);
}
.ff-tl-item.done .ff-tl-dot {
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-soft);
}
.ff-tl-item.active .ff-tl-dot {
  background: var(--panel);
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-soft);
}
.ff-tl-item.active .ff-tl-dot::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: var(--blue);
}
